<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai</title>
</head>
<body style="background-color: #212121; color: white;">

    
</body>
<script>
    const div = document.createElement('div')
    console.log(div)
    div.className = "main"
    div.id = Math.round(Math.random() * 10 + 1)
    div.setAttribute("title", "generated title")
    div.style.backgroundColor = "green"
    div.style.padding = "12px"
    // div.innerText = "Chai aur code"
    // ye jo .innertext, .id, .className wale tareeke hai ye overwrite krte hai
    // first ye text ko leke aate then overwrite krte..
    // jo set attribute hai wo leke nhi aata wo directly overwrite kr deta hai
    // isilie kaafi log setAttribute prefer krte..
    // people prefer this :-
    const  addText = document.createTextNode("Chai aur code")
    div.appendChild(addText)

    document.body.appendChild(div)
</script>
</html>
